name: One-time Chimp Hawk PNG import
on:
  push:
    branches:
      - fix/launcher-chimp-hawk-underground
    paths:
      - '.asset-staging/chimp-hawk/**'
      - '.github/workflows/assemble-chimp-hawk.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore exact uploaded PNG
        run: python .asset-staging/chimp-hawk/assemble.py
      - name: Save original cartridge and remove one-time importer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/launcher/cartridge-chimp-hawk-underground.png
          git rm -r .asset-staging/chimp-hawk
          git rm .github/workflows/assemble-chimp-hawk.yml
          git commit -m "Add exact Chimp Hawk Underground cartridge PNG [skip ci]"
          git push origin HEAD:fix/launcher-chimp-hawk-underground
